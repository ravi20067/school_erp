# ============================================================
# SCHOOL ERP - NGINX CONFIGURATION
#
# Supports:
#   1. Local HTTP  : http://localhost
#   2. Local HTTPS : https://localhost
#   3. ngrok HTTPS : https://xxxxx.ngrok-free.dev
#
# Architecture:
#
# Browser
#    |
#    +---- Local HTTP ------> Nginx :80
#    |
#    +---- Local HTTPS -----> Nginx :443
#    |
#    +---- ngrok HTTPS -----> ngrok ----HTTP----> Nginx :80
#
# Nginx
#    |
#    +---- /       -------> frontend:80
#    +---- /api/   -------> backend:7777
#    +---- /ws/    -------> backend:7777
# ============================================================


# ============================================================
# HTTP SERVER
# ============================================================

server {

    listen 80;
    server_name _;

    client_max_body_size 100M;


    # ========================================================
    # SPRING BOOT REST API
    # ========================================================

    location /api/ {

        proxy_pass http://backend:7777/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
                         $proxy_add_x_forwarded_for;

        # Preserve original protocol when available.
        # With ngrok:
        # Browser HTTPS -> ngrok -> HTTP -> Nginx
        #
        # ngrok normally supplies X-Forwarded-Proto.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # ========================================================
    # WEBSOCKET
    # ========================================================

    location /ws/ {

        proxy_pass http://backend:7777/ws/;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
                         $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_set_header X-Forwarded-Host $host;

        # Keep WebSocket connection alive
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        proxy_buffering off;
    }


    # ========================================================
    # REACT FRONTEND
    # ========================================================

    location / {

        proxy_pass http://frontend:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
                         $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # ========================================================
    # STATIC ASSETS
    # ========================================================

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {

        proxy_pass http://frontend:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
                         $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        expires 30d;

        add_header Cache-Control "public, immutable";

        access_log off;
    }
}


# ============================================================
# HTTPS SERVER
#
# Used for:
#
#     https://localhost
#     https://127.0.0.1
#     https://YOUR-LAN-IP
#
# ngrok does NOT need to use this block.
# ngrok terminates public HTTPS and forwards to port 80.
# ============================================================

server {

    listen 443 ssl;
    server_name _;

    client_max_body_size 100M;


    # ========================================================
    # SSL CERTIFICATE
    # ========================================================

    ssl_certificate
        /etc/nginx/ssl/cert.pem;

    ssl_certificate_key
        /etc/nginx/ssl/key.pem;


    # ========================================================
    # TLS SETTINGS
    # ========================================================

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_cache shared:SSL:10m;

    ssl_session_timeout 10m;


    # ========================================================
    # SPRING BOOT REST API
    # ========================================================

    location /api/ {

        proxy_pass http://backend:7777/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
                         $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # ========================================================
    # WEBSOCKET
    # ========================================================

    location /ws/ {

        proxy_pass http://backend:7777/ws/;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
                         $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        proxy_buffering off;
    }


    # ========================================================
    # REACT FRONTEND
    # ========================================================

    location / {

        proxy_pass http://frontend:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
                         $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # ========================================================
    # STATIC ASSETS
    # ========================================================

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {

        proxy_pass http://frontend:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
                         $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;

        expires 30d;

        add_header Cache-Control "public, immutable";

        access_log off;
    }
}